<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Regular stamen -->
    <g id="stamen">
      <line x1="256" y1="232" x2="256" y2="180" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
      </line>
      <circle cx="256" cy="178" r="8" fill="#FFFFFF">
      </circle>
    </g>
    <!-- Small triangular stamen -->
    <path id="small-stamen" d="
    M 254 232
    Q 254 229 255 226
    Q 256 224 257 226
    Q 258 229 258 232
    Q 256 233 254 232
    Z
  " fill="#FFD9DE"/>
  </defs>
  <!-- SMALL STAMENS -->
  <g>
    <use href="#small-stamen" transform="rotate(45 256 256)">
    </use>
    <use href="#small-stamen" transform="rotate(135 256 256)">
    </use>
    <use href="#small-stamen" transform="rotate(225 256 256)">
    </use>
    <use href="#small-stamen" transform="rotate(315 256 256)">
    </use>
  </g>
  <!-- REGULAR STAMENS -->
  <g>
    <use href="#stamen" transform="rotate(0 256 256)">
    </use>
    <use href="#stamen" transform="rotate(30 256 256)">
    </use>
    <use href="#stamen" transform="rotate(60 256 256)">
    </use>
    <use href="#stamen" transform="rotate(90 256 256)">
    </use>
    <use href="#stamen" transform="rotate(120 256 256)">
    </use>
    <use href="#stamen" transform="rotate(150 256 256)">
    </use>
    <use href="#stamen" transform="rotate(180 256 256)">
    </use>
    <use href="#stamen" transform="rotate(210 256 256)">
    </use>
    <use href="#stamen" transform="rotate(240 256 256)">
    </use>
    <use href="#stamen" transform="rotate(270 256 256)">
    </use>
    <use href="#stamen" transform="rotate(300 256 256)">
    </use>
    <use href="#stamen" transform="rotate(330 256 256)">
    </use>
  </g>
</svg>
